<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长难句 · 主谓宾分析练习</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  background: #f5f4f0;
  color: #1a1a1a;
  min-height: 100vh;
}

/* ===== Start Screen ===== */
#startScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #f5f4f0 0%, #e8f5e9 100%);
}
.start-card {
  background: #fff;
  border-radius: 20px;
  padding: 48px 40px;
  width: 100%;
  max-width: 540px;
  box-shadow: 0 8px 40px rgba(46,125,50,0.12);
  text-align: center;
}
.start-logo {
  width: 64px; height: 64px;
  background: #2E7D32;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 28px;
  font-weight: 700;
  margin: 0 auto 20px;
}
.start-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.start-card p  { font-size: 14px; color: #888; margin-bottom: 32px; line-height: 1.7; }
.start-btn {
  padding: 14px 48px;
  background: #2E7D32;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.start-btn:hover { background: #1B5E20; }
.start-btn.secondary { background: #888; }
.start-btn.secondary:hover { background: #666; }

/* ===== Header ===== */
.page-header {
  background: #fff;
  border-bottom: 0.5px solid rgba(0,0,0,0.1);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo-badge {
  width: 36px; height: 36px;
  background: #2E7D32;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  flex-shrink: 0;
}
.page-header h1 { font-size: 15px; font-weight: 500; }
.page-header p { font-size: 12px; color: #888; margin-top: 2px; }
.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.timer-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: #FFF3E0;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 13px;
  color: #E65100;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.error-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: #FFEBEE;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 13px;
  color: #C62828;
  font-weight: 500;
}
.remaining-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: #E8F5E9;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 13px;
  color: #2E7D32;
  font-weight: 500;
}

/* ===== Container ===== */
.container {
  max-width: 840px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}

/* ===== Progress bar ===== */
.progress-wrap { margin-bottom: 18px; }
.progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 6px; }
.progress-bar { height: 8px; background: rgba(0,0,0,0.08); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: #2E7D32; border-radius: 4px; transition: width 0.4s ease; }

/* ===== Task Hint ===== */
.task-hint {
  background: #E8F5E9;
  border: 0.5px solid #A5D6A7;
  border-radius: 10px;
  padding: 10px 16px;
  margin-bottom: 14px;
  font-size: 13px;
  color: #1B5E20;
  line-height: 1.6;
  display: flex;
  align-items: center;
  gap: 8px;
}
.task-hint .hint-icon {
  font-weight: 600;
  background: #2E7D32;
  color: #fff;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 12px;
  flex-shrink: 0;
}

/* ===== Role Selector ===== */
.role-selector {
  background: #fff;
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.role-label {
  font-size: 13px;
  color: #888;
  flex-shrink: 0;
  margin-right: 2px;
}
.role-btn {
  padding: 6px 14px;
  border: 1.5px solid rgba(0,0,0,0.15);
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  background: #fff;
  color: #1a1a1a;
  transition: all 0.15s;
  font-weight: 500;
}
.role-btn:hover { border-color: #2E7D32; color: #2E7D32; }
.role-btn.active-S { background: #1565C0; color: #fff; border-color: #1565C0; }
.role-btn.active-V { background: #E65100; color: #fff; border-color: #E65100; }
.role-btn.active-O { background: #7B1FA2; color: #fff; border-color: #7B1FA2; }
.role-btn.active-L { background: #00838F; color: #fff; border-color: #00838F; }
.role-btn.active-P { background: #C2185B; color: #fff; border-color: #C2185B; }

/* ===== Undo Button ===== */
.undo-btn {
  margin-left: auto;
  padding: 6px 12px;
  border: 1.5px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  background: #fff;
  color: #888;
  transition: all 0.15s;
}
.undo-btn:hover { border-color: #E65100; color: #E65100; }
.undo-btn:disabled { opacity: 0.3; cursor: default; }

/* ===== Sentence Display ===== */
.sentence-area {
  background: #fff;
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 14px;
  padding: 24px 28px;
  margin-bottom: 14px;
  line-height: 2.8;
  font-size: 18px;
}
.word-token {
  display: inline-block;
  padding: 4px 8px;
  margin: 2px 2px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1.5px solid transparent;
  user-select: none;
  position: relative;
  vertical-align: baseline;
  color: #1a1a1a;
}

/* Default: all words look the same — clickable */
.word-token.wt-ready {
  border-color: #E0E0E0;
  background: #FAFAFA;
}
.word-token.wt-ready:hover {
  background: #E8F5E9;
  border-color: #66BB6A;
}

/* Done: word assigned a role */
.word-token.wt-done {
  cursor: pointer;
  font-weight: 500;
}
.word-token.wt-done:hover {
  opacity: 0.8;
}

/* Role coloring for done words */
.word-token.r-S { background: #E3F2FD; border-color: #64B5F6; color: #1565C0; }
.word-token.r-V { background: #FFF3E0; border-color: #FFB74D; color: #E65100; }
.word-token.r-O { background: #F3E5F5; border-color: #CE93D8; color: #7B1FA2; }
.word-token.r-L { background: #E0F7FA; border-color: #4DD0E1; color: #00838F; }
.word-token.r-P { background: #FCE4EC; border-color: #F48FB1; color: #C2185B; }

/* Role label tag (shown above the word) */
.role-tag {
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 4px;
  white-space: nowrap;
  line-height: 1.4;
  pointer-events: none;
}
.r-S .role-tag { background: #1565C0; color: #fff; }
.r-V .role-tag { background: #E65100; color: #fff; }
.r-O .role-tag { background: #7B1FA2; color: #fff; }
.r-L .role-tag { background: #00838F; color: #fff; }
.r-P .role-tag { background: #C2185B; color: #fff; }

/* Wrong flash */
.word-token.wrong-flash {
  animation: wrongShake 0.45s;
  background: #FFCDD2 !important;
  border-color: #E53935 !important;
  color: #C62828 !important;
}
@keyframes wrongShake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

/* Correct pop */
.word-token.correct-pop {
  animation: correctPop 0.35s;
}
@keyframes correctPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

/* ===== Feedback ===== */
.feedback-box {
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 14px;
  display: none;
  line-height: 1.5;
}
.feedback-box.show { display: flex; align-items: center; gap: 8px; }
.feedback-box.ok   { background: #E8F5E9; color: #1B5E20; border: 0.5px solid #A5D6A7; }
.feedback-box.err  { background: #FFEBEE; color: #B71C1C; border: 0.5px solid #EF9A9A; }
.feedback-box.info { background: #E3F2FD; color: #0D47A1; border: 0.5px solid #90CAF9; }

/* ===== Submit Button ===== */
.submit-area {
  text-align: center;
  margin-top: 8px;
  margin-bottom: 14px;
}
.submit-btn {
  padding: 12px 36px;
  background: #2E7D32;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.submit-btn:hover { background: #1B5E20; }
.submit-btn:disabled { background: #ccc; cursor: default; }

/* ===== Analysis Panel (shown after submit) ===== */
.analysis-panel {
  background: #fff;
  border: 0.5px solid rgba(0,0,0,0.1);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 14px;
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.analysis-title {
  font-size: 15px;
  font-weight: 600;
  color: #2E7D32;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.analysis-clause {
  margin-bottom: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 0.5px solid rgba(0,0,0,0.08);
}
.analysis-clause.main-clause {
  background: #E8F5E9;
  border-color: #A5D6A7;
}
.analysis-clause.sub-clause {
  background: #FFF8E1;
  border-color: #FFE082;
}
.clause-label-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 10px;
  margin-bottom: 8px;
}
.main-clause .clause-label-tag { background: #2E7D32; color: #fff; }
.sub-clause .clause-label-tag { background: #FF8F00; color: #fff; }
.analysis-words {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.analysis-word-tag {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 8px;
  font-weight: 500;
}
.analysis-word-tag.r-S { background: #E3F2FD; color: #1565C0; }
.analysis-word-tag.r-V { background: #FFF3E0; color: #E65100; }
.analysis-word-tag.r-O { background: #F3E5F5; color: #7B1FA2; }
.analysis-word-tag.r-L { background: #E0F7FA; color: #00838F; }
.analysis-word-tag.r-P { background: #FCE4EC; color: #C2185B; }

/* ===== Sentence Transition ===== */
.sentence-transition {
  text-align: center;
  padding: 60px 20px;
  animation: fadeIn 0.4s ease;
}
.sentence-transition .trans-num {
  font-size: 14px;
  color: #888;
  margin-bottom: 8px;
}
.sentence-transition .trans-msg {
  font-size: 20px;
  font-weight: 600;
  color: #2E7D32;
}
.sentence-transition .trans-detail {
  font-size: 13px;
  color: #888;
  margin-top: 6px;
}

/* ===== Legend ===== */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  font-size: 12px;
  color: #666;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.legend-dot {
  width: 14px; height: 14px;
  border-radius: 4px;
  flex-shrink: 0;
}
.legend-dot.s-dot { background: #E3F2FD; border: 1px solid #64B5F6; }
.legend-dot.v-dot { background: #FFF3E0; border: 1px solid #FFB74D; }
.legend-dot.o-dot { background: #F3E5F5; border: 1px solid #CE93D8; }
.legend-dot.l-dot { background: #E0F7FA; border: 1px solid #4DD0E1; }
.legend-dot.p-dot { background: #FCE4EC; border: 1px solid #F48FB1; }

/* ===== Result Card (Summary) ===== */
.result-card {
  background: #fff;
  border-radius: 16px;
  border: 0.5px solid rgba(0,0,0,0.08);
  padding: 24px 20px;
  margin-bottom: 16px;
}
.result-card h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  color: #2E7D32;
}
.result-sentence {
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 12px;
  padding: 10px 14px;
  background: #FAFAFA;
  border-radius: 8px;
}
.result-clauses {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.result-clause-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}
.result-clause-label {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  flex-shrink: 0;
}
.result-clause-label.main-label { background: #E8F5E9; color: #2E7D32; }
.result-clause-label.sub-label  { background: #FFF8E1; color: #FF8F00; }
.result-time {
  font-size: 12px;
  color: #888;
  margin-top: 6px;
}
.result-errors {
  font-size: 12px;
  color: #C62828;
  margin-top: 2px;
}

/* ===== Summary Screen ===== */
#summaryScreen { display: none; }
#summaryScreen.show { display: block; }
.summary-header {
  text-align: center;
  padding: 36px 20px;
  background: #fff;
  border-radius: 16px;
  border: 0.5px solid rgba(0,0,0,0.08);
  margin-bottom: 20px;
}
.summary-header h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.summary-header .summary-score {
  font-size: 52px;
  font-weight: 700;
  color: #2E7D32;
  margin: 12px 0;
}
.summary-header .summary-detail {
  font-size: 14px;
  color: #888;
  line-height: 1.8;
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .sentence-area { font-size: 16px; padding: 16px; line-height: 2.6; }
  .role-selector { gap: 6px; }
  .role-btn { padding: 5px 12px; font-size: 12px; }
  .header-right { gap: 6px; }
  .timer-chip, .error-chip, .remaining-chip { font-size: 12px; padding: 3px 8px; }
}
</style>
</head>
<body>

<!-- ============================================================
     START SCREEN
     ============================================================ -->
<div id="startScreen">
  <div class="start-card">
    <div class="start-logo">句</div>
    <h2>长难句 · 主谓宾分析</h2>
    <p>找出长难句中的核心语法成分<br>选择角色，点击单词，标注主谓宾<br><span style="font-size:12px;color:#aaa">共 60 句 · 每次随机 5 句 · 记录用时与错误</span></p>
    <button class="start-btn" onclick="startPractice()">开始练习</button>
  </div>
</div>

<!-- ============================================================
     MAIN APP
     ============================================================ -->
<div id="appScreen" style="display:none">
  <div class="page-header">
    <div class="logo-badge">句</div>
    <div>
      <h1>长难句 · 主谓宾分析</h1>
      <p>选择角色 → 点击单词 → 标注语法成分</p>
    </div>
    <div class="header-right">
      <div class="remaining-chip">剩余 <span id="remainingText">0</span></div>
      <div class="timer-chip">⏱ <span id="timerText">0.0s</span></div>
      <div class="error-chip">✗ <span id="errorText">0</span></div>
    </div>
  </div>

  <div class="container">
    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progressText">第 1 句 / 共 10 句</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <!-- Main content area -->
    <div id="mainContent">
      <!-- Legend -->
      <div class="legend" id="legendArea">
        <div class="legend-item"><div class="legend-dot s-dot"></div>主语 S</div>
        <div class="legend-item"><div class="legend-dot v-dot"></div>谓语 V</div>
        <div class="legend-item"><div class="legend-dot o-dot"></div>宾语 O</div>
        <div class="legend-item"><div class="legend-dot l-dot"></div>系动词 L</div>
        <div class="legend-item"><div class="legend-dot p-dot"></div>表语 P</div>
      </div>

      <!-- Task hint (generic, no clause info) -->
      <div class="task-hint" id="taskHint">
        <span class="hint-icon">提示</span>
        <span>找出句子中所有核心成分（主语、谓语、宾语、系动词、表语），选择角色后点击对应单词</span>
      </div>

      <!-- Role selector -->
      <div class="role-selector" id="roleSelector">
        <span class="role-label">选择角色：</span>
        <button class="role-btn" data-role="S" onclick="selectRole('S')">主语 S</button>
        <button class="role-btn" data-role="V" onclick="selectRole('V')">谓语 V</button>
        <button class="role-btn" data-role="O" onclick="selectRole('O')">宾语 O</button>
        <button class="role-btn" data-role="L" onclick="selectRole('L')">系动词 L</button>
        <button class="role-btn" data-role="P" onclick="selectRole('P')">表语 P</button>
        <button class="undo-btn" id="undoBtn" onclick="undoLast()" disabled>↩ 撤销</button>
      </div>

      <!-- Sentence display -->
      <div class="sentence-area" id="sentenceArea"></div>

      <!-- Feedback -->
      <div class="feedback-box" id="feedbackBox"></div>

      <!-- Submit button -->
      <div class="submit-area" id="submitArea">
        <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">确认完成</button>
      </div>

      <!-- Analysis panel (shown after submit) -->
      <div id="analysisPanel"></div>
    </div>
  </div>
</div>

<!-- ============================================================
     SUMMARY SCREEN
     ============================================================ -->
<div id="summaryScreen">
  <div class="page-header">
    <div class="logo-badge">句</div>
    <div>
      <h1>练习完成</h1>
      <p>本次练习结果总结</p>
    </div>
  </div>
  <div class="container" id="summaryContent"></div>
</div>

<script>
// 长难句60句语法标注数据
// 格式: { text, clauses: [{ type, label, words: [{idx, role}] }] }
// role: S=主语 V=谓语 O=宾语 L=系动词 P=表语
// idx: 对应 text.split(/\s+/) 后的词索引(从0开始)
// 标点符号前加空格使其成为独立token
// 不在words中的词 = 修饰成分(定语/状语/介词短语等)，显示为灰色

const SENTENCES = [
  // ===== 句1 =====
  // "Bats comprise roughly one-fifth of all mammal species in Madagascar and thirty-six recorded bat species are native to the island , making it one of the most important regions for conservation of this animal group anywhere in the world ."
  // 分词: 0=Bats 1=comprise 2=roughly 3=one-fifth 4=of 5=all 6=mammal 7=species 8=in 9=Madagascar
  //        10=and 11=thirty-six 12=recorded 13=bat 14=species 15=are 16=native 17=to 18=the 19=island
  //        20=, 21=making 22=it 23=one 24=of 25=the 26=most 27=important 28=regions 29=for
  //        30=conservation 31=of 32=this 33=animal 34=group 35=anywhere 36=in 37=the 38=world 39=.
  {
    text: "Bats comprise roughly one-fifth of all mammal species in Madagascar and thirty-six recorded bat species are native to the island , making it one of the most important regions for conservation of this animal group anywhere in the world .",
    clauses: [
      {
        type: "main",
        label: "并列主句1",
        words: [
          { idx: 0, role: "S" },   // Bats
          { idx: 1, role: "V" },   // comprise
          { idx: 3, role: "O" }    // one-fifth
        ]
      },
      {
        type: "main",
        label: "并列主句2",
        words: [
          { idx: 11, role: "S" },  // thirty-six
          { idx: 12, role: "S" },  // recorded
          { idx: 13, role: "S" },  // bat
          { idx: 14, role: "S" },  // species
          { idx: 15, role: "L" },  // are
          { idx: 16, role: "P" }   // native
        ]
      },
      {
        type: "sub",
        label: "结果状语",
        words: [
          { idx: 22, role: "S" },  // it
          { idx: 21, role: "V" }   // making
        ]

<script>
const ROLE_NAMES = { S: "主语", V: "谓语", O: "宾语", L: "系动词", P: "表语" };
const ROLE_SHORT = { S: "主", V: "谓", O: "宾", L: "系", P: "表" };

// ============================================================
//  App State
// ============================================================
let state = {
  sentenceIdx: 0,
  currentBatch: [],         // 当前随机抽取的句子索引数组
  selectedRole: null,
  tokens: [],              // current sentence tokens
  allAnswerWords: [],      // all words that need roles (flattened from all clauses)
  userAnnotations: {},     // { tokenIdx: role } — user's current annotations
  annotationHistory: [],   // [{idx, role}] for undo
  errorCount: 0,
  totalErrors: 0,
  startTime: 0,
  timerInterval: null,
  results: [],
  submitted: false         // whether current sentence has been submitted
};

// ============================================================
//  Shuffle utility (Fisher-Yates)
// ============================================================
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
//  Pick N random sentence indices
// ============================================================
function pickRandomSentences(n) {
  const indices = Array.from({ length: SENTENCES.length }, (_, i) => i);
  return shuffleArray(indices).slice(0, n);
}

// ============================================================
//  Start
// ============================================================
function startPractice() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = '';
  state.sentenceIdx = 0;
  state.totalErrors = 0;
  state.results = [];
  state.currentBatch = pickRandomSentences(5);
  loadSentence();
}

// ============================================================
//  Load Sentence
// ============================================================
function loadSentence() {
  if (state.sentenceIdx >= state.currentBatch.length) {
    showSummary();
    return;
  }

  const sent = SENTENCES[state.currentBatch[state.sentenceIdx]];
  state.tokens = sent.text.split(/\s+/).filter(t => t.length > 0);

  // Flatten all answer words from all clauses
  state.allAnswerWords = [];
  sent.clauses.forEach(clause => {
    clause.words.forEach(w => {
      state.allAnswerWords.push({ idx: w.idx, role: w.role, clauseType: clause.type, clauseLabel: clause.label });
    });
  });

  state.userAnnotations = {};
  state.annotationHistory = [];
  state.selectedRole = null;
  state.errorCount = 0;
  state.submitted = false;

  // Timer
  state.startTime = Date.now();
  startTimer();

  // UI
  updateProgress();
  updateErrorDisplay();
  updateRemainingDisplay();
  resetRoleSelector();
  hideFeedback();

  renderSentence();
}

// ============================================================
//  Render Sentence — all words look the same
// ============================================================
function renderSentence() {
  const area = document.getElementById('sentenceArea');
  area.innerHTML = '';

  state.tokens.forEach((token, i) => {
    const span = document.createElement('span');
    span.className = 'word-token wt-ready';
    span.textContent = token;
    span.dataset.idx = i;
    span.id = 'wt' + i;
    span.addEventListener('click', () => handleWordClick(i));
    area.appendChild(span);
    area.appendChild(document.createTextNode(' '));
  });

  // Show submit button, hide analysis
  document.getElementById('submitArea').style.display = '';
  document.getElementById('analysisPanel').innerHTML = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '确认完成';
}

// ============================================================
//  Handle Word Click
// ============================================================
function handleWordClick(tokenIdx) {
  if (state.submitted) return; // already submitted

  if (!state.selectedRole) {
    showFeedback('💡 请先选择一个语法角色', 'info');
    return;
  }

  // If already annotated with the same role, remove it (toggle off)
  if (state.userAnnotations[tokenIdx] === state.selectedRole) {
    delete state.userAnnotations[tokenIdx];
    state.annotationHistory = state.annotationHistory.filter(a => a.idx !== tokenIdx);
    refreshWordDisplay();
    updateRemainingDisplay();
    updateUndoBtn();
    hideFeedback();
    return;
  }

  // Check if this word has a role in the answer
  const answerEntry = state.allAnswerWords.find(w => w.idx === tokenIdx);

  if (answerEntry) {
    // This word IS a core component — check if role matches
    if (state.selectedRole === answerEntry.role) {
      // ✅ Correct
      state.userAnnotations[tokenIdx] = state.selectedRole;
      state.annotationHistory.push({ idx: tokenIdx, role: state.selectedRole });

      const el = document.getElementById('wt' + tokenIdx);
      if (el) el.classList.add('correct-pop');

      refreshWordDisplay();
      updateRemainingDisplay();
      updateUndoBtn();

      const remaining = state.allAnswerWords.filter(w => !(w.idx in state.userAnnotations)).length;
      if (remaining === 0) {
        showFeedback('✅ 所有核心成分已找出！点击"确认完成"查看解析', 'ok');
      } else {
        showFeedback(`✅ 正确！还剩 ${remaining} 个核心成分`, 'ok');
      }
    } else {
      // ❌ Wrong role
      state.errorCount++;
      state.totalErrors++;
      updateErrorDisplay();

      const el = document.getElementById('wt' + tokenIdx);
      if (el) {
        el.classList.add('wrong-flash');
        setTimeout(() => el.classList.remove('wrong-flash'), 500);
      }

      showFeedback(`❌ "${state.tokens[tokenIdx]}" 不是${ROLE_NAMES[state.selectedRole]}，再想想`, 'err');
    }
  } else {
    // This word is NOT a core component (modifier, preposition, etc.)
    state.errorCount++;
    state.totalErrors++;
    updateErrorDisplay();

    const el = document.getElementById('wt' + tokenIdx);
    if (el) {
      el.classList.add('wrong-flash');
      setTimeout(() => el.classList.remove('wrong-flash'), 500);
    }

    showFeedback(`❌ "${state.tokens[tokenIdx]}" 不是核心成分（主/谓/宾/系/表），再想想`, 'err');
  }

  state.selectedRole = null;
  resetRoleSelector();
}

// ============================================================
//  Refresh Word Display
// ============================================================
function refreshWordDisplay() {
  state.tokens.forEach((_, i) => {
    const el = document.getElementById('wt' + i);
    if (!el) return;

    // Remove old role tag if any
    const oldTag = el.querySelector('.role-tag');
    if (oldTag) oldTag.remove();

    if (i in state.userAnnotations) {
      const role = state.userAnnotations[i];
      el.className = 'word-token wt-done r-' + role;
      // Add role tag
      const tag = document.createElement('span');
      tag.className = 'role-tag';
      tag.textContent = ROLE_SHORT[role];
      el.appendChild(tag);
    } else {
      el.className = 'word-token wt-ready';
    }
  });
}

// ============================================================
//  Undo Last Annotation
// ============================================================
function undoLast() {
  if (state.annotationHistory.length === 0 || state.submitted) return;
  const last = state.annotationHistory.pop();
  delete state.userAnnotations[last.idx];
  refreshWordDisplay();
  updateRemainingDisplay();
  updateUndoBtn();
  hideFeedback();
}

function updateUndoBtn() {
  const btn = document.getElementById('undoBtn');
  if (btn) btn.disabled = state.annotationHistory.length === 0 || state.submitted;
}

// ============================================================
//  Submit Answer — show analysis
// ============================================================
function submitAnswer() {
  if (state.submitted) {
    // Already submitted, go to next sentence
    finishSentence();
    return;
  }

  state.submitted = true;
  stopTimer();
  const elapsed = (Date.now() - state.startTime) / 1000;

  // Count how many correct
  let correctCount = 0;
  state.allAnswerWords.forEach(w => {
    if (state.userAnnotations[w.idx] === w.role) correctCount++;
  });
  const totalNeeded = state.allAnswerWords.length;

  // Build analysis panel
  const sent = SENTENCES[state.sentenceIdx];
  let html = '<div class="analysis-panel"><div class="analysis-title">📋 从句结构解析</div>';

  // Show each clause with its words
  // Sort: main clauses first
  const sortedClauses = [...sent.clauses].sort((a, b) => {
    if (a.type === 'main' && b.type !== 'main') return -1;
    if (a.type !== 'main' && b.type === 'main') return 1;
    return 0;
  });

  sortedClauses.forEach(clause => {
    const clauseClass = clause.type === 'main' ? 'main-clause' : 'sub-clause';
    html += `<div class="analysis-clause ${clauseClass}">`;
    html += `<span class="clause-label-tag">${clause.label}</span>`;
    html += '<div class="analysis-words">';

    const roleOrder = ['S', 'V', 'O', 'L', 'P'];
    roleOrder.forEach(role => {
      clause.words.filter(w => w.role === role).forEach(w => {
        html += `<span class="analysis-word-tag r-${w.role}">${ROLE_SHORT[w.role]}: ${state.tokens[w.idx]}</span>`;
      });
    });

    html += '</div></div>';
  });

  // Show score summary
  html += `<div style="margin-top:12px;font-size:13px;color:#666">`;
  html += `你找出了 ${correctCount}/${totalNeeded} 个核心成分`;
  if (state.errorCount > 0) html += ` · 错误 ${state.errorCount} 次`;
  html += ` · 用时 ${elapsed.toFixed(1)}s`;
  html += '</div>';

  html += '</div>';

  document.getElementById('analysisPanel').innerHTML = html;
  document.getElementById('submitBtn').textContent = '下一句 →';
  document.getElementById('submitBtn').disabled = false;

  // Also highlight missed words in the sentence area
  state.allAnswerWords.forEach(w => {
    if (!(w.idx in state.userAnnotations)) {
      const el = document.getElementById('wt' + w.idx);
      if (el) {
        // Show the missed word with its correct role
        el.className = 'word-token wt-done r-' + w.role;
        el.style.opacity = '0.6';
        el.style.borderStyle = 'dashed';
        const tag = document.createElement('span');
        tag.className = 'role-tag';
        tag.textContent = ROLE_SHORT[w.role];
        el.appendChild(tag);
      }
    }
  });
}

// ============================================================
//  Finish Sentence
// ============================================================
function finishSentence() {
  const elapsed = (Date.now() - state.startTime) / 1000;

  // Count correct
  let correctCount = 0;
  state.allAnswerWords.forEach(w => {
    if (state.userAnnotations[w.idx] === w.role) correctCount++;
  });

  const sent = SENTENCES[state.sentenceIdx];
  state.results.push({
    sentenceIdx: state.sentenceIdx,
    text: sent.text,
    tokens: [...state.tokens],
    errors: state.errorCount,
    time: elapsed,
    correct: correctCount,
    total: state.allAnswerWords.length,
    clauses: sent.clauses.map(c => ({
      type: c.type,
      label: c.label,
      words: [...c.words]
    }))
  });

  // Show brief transition
  const mainContent = document.getElementById('mainContent');
  const nextIdx = state.sentenceIdx + 1;

  if (nextIdx < state.currentBatch.length) {
    mainContent.innerHTML = `
      <div class="sentence-transition">
        <div class="trans-num">第 ${state.sentenceIdx + 1} 句完成</div>
        <div class="trans-msg">✅ 用时 ${elapsed.toFixed(1)}s · 错误 ${state.errorCount} 次</div>
        <div class="trans-detail">正在加载第 ${nextIdx + 1} 句…</div>
      </div>
    `;
  }

  state.sentenceIdx++;
  updateProgress();

  setTimeout(() => {
    rebuildMainContent();
    loadSentence();
  }, 1500);
}

// ============================================================
//  Rebuild Main Content (after transition)
// ============================================================
function rebuildMainContent() {
  const mc = document.getElementById('mainContent');
  mc.innerHTML = `
    <div class="legend" id="legendArea">
      <div class="legend-item"><div class="legend-dot s-dot"></div>主语 S</div>
      <div class="legend-item"><div class="legend-dot v-dot"></div>谓语 V</div>
      <div class="legend-item"><div class="legend-dot o-dot"></div>宾语 O</div>
      <div class="legend-item"><div class="legend-dot l-dot"></div>系动词 L</div>
      <div class="legend-item"><div class="legend-dot p-dot"></div>表语 P</div>
    </div>
    <div class="task-hint" id="taskHint">
      <span class="hint-icon">提示</span>
      <span>找出句子中所有核心成分（主语、谓语、宾语、系动词、表语），选择角色后点击对应单词</span>
    </div>
    <div class="role-selector" id="roleSelector">
      <span class="role-label">选择角色：</span>
      <button class="role-btn" data-role="S" onclick="selectRole('S')">主语 S</button>
      <button class="role-btn" data-role="V" onclick="selectRole('V')">谓语 V</button>
      <button class="role-btn" data-role="O" onclick="selectRole('O')">宾语 O</button>
      <button class="role-btn" data-role="L" onclick="selectRole('L')">系动词 L</button>
      <button class="role-btn" data-role="P" onclick="selectRole('P')">表语 P</button>
      <button class="undo-btn" id="undoBtn" onclick="undoLast()" disabled>↩ 撤销</button>
    </div>
    <div class="sentence-area" id="sentenceArea"></div>
    <div class="feedback-box" id="feedbackBox"></div>
    <div class="submit-area" id="submitArea">
      <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">确认完成</button>
    </div>
    <div id="analysisPanel"></div>
  `;
}

// ============================================================
//  Role Selector
// ============================================================
function selectRole(role) {
  state.selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(btn => {
    const r = btn.dataset.role;
    btn.className = 'role-btn' + (r === role ? ' active-' + role : '');
  });
}

function resetRoleSelector() {
  state.selectedRole = null;
  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.className = 'role-btn';
  });
}

// ============================================================
//  Timer
// ============================================================
function startTimer() {
  stopTimer();
  state.timerInterval = setInterval(() => {
    const elapsed = (Date.now() - state.startTime) / 1000;
    document.getElementById('timerText').textContent = elapsed.toFixed(1) + 's';
  }, 100);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

// ============================================================
//  UI Helpers
// ============================================================
function updateProgress() {
  const batchTotal = state.currentBatch.length;
  const batchIdx = state.sentenceIdx;
  const pct = Math.round(batchIdx / batchTotal * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressText').textContent = `第 ${state.sentenceIdx + 1} 句 / 本轮 ${batchTotal} 句（${batchIdx + 1}/${batchTotal}）`;
}

function updateErrorDisplay() {
  document.getElementById('errorText').textContent = state.errorCount;
}

function updateRemainingDisplay() {
  const remaining = state.allAnswerWords.filter(w => !(w.idx in state.userAnnotations)).length;
  const el = document.getElementById('remainingText');
  if (el) el.textContent = remaining;
}

function showFeedback(msg, type) {
  const box = document.getElementById('feedbackBox');
  if (!box) return;
  box.className = 'feedback-box show ' + type;
  box.textContent = msg;
}

function hideFeedback() {
  const box = document.getElementById('feedbackBox');
  if (box) box.className = 'feedback-box';
}

// ============================================================
//  Summary
// ============================================================
function showSummary() {
  stopTimer();
  document.getElementById('appScreen').style.display = 'none';
  const screen = document.getElementById('summaryScreen');
  screen.style.display = '';
  screen.classList.add('show');

  const content = document.getElementById('summaryContent');
  const totalTime = state.results.reduce((s, r) => s + r.time, 0);
  const totalErr = state.results.reduce((s, r) => s + r.errors, 0);
  const totalCorrect = state.results.reduce((s, r) => s + r.correct, 0);
  const totalWords = state.results.reduce((s, r) => s + r.total, 0);
  const avgTime = state.results.length > 0 ? totalTime / state.results.length : 0;
  const accuracy = totalWords > 0 ? Math.round(totalCorrect / totalWords * 100) : 0;

  let rating = '继续加油';
  if (totalErr === 0 && accuracy === 100) rating = '🏆 完美';
  else if (accuracy >= 90) rating = '⭐ 优秀';
  else if (accuracy >= 70) rating = '👍 良好';

  let html = `
    <div class="summary-header">
      <h2>练习完成</h2>
      <div class="summary-score">${rating}</div>
      <div class="summary-detail">
        共 ${state.results.length} 句 · 总用时 ${totalTime.toFixed(1)}s · 平均 ${avgTime.toFixed(1)}s/句<br>
        正确率 ${accuracy}%（${totalCorrect}/${totalWords}） · 总错误 ${totalErr} 次
      </div>
    </div>
  `;

  state.results.forEach((result, i) => {
    const resultAcc = result.total > 0 ? Math.round(result.correct / result.total * 100) : 0;
    html += `<div class="result-card">
      <h3>第 ${i + 1} 句</h3>
      <div class="result-sentence">${result.text}</div>
      <div class="result-clauses">`;

    result.clauses.forEach(clause => {
      html += `<div class="result-clause-row">
        <span class="result-clause-label ${clause.type === 'main' ? 'main-label' : 'sub-label'}">${clause.label}</span>`;
      const roleOrder = ['S', 'V', 'O', 'L', 'P'];
      roleOrder.forEach(role => {
        clause.words.filter(w => w.role === role).forEach(w => {
          html += `<span class="analysis-word-tag r-${w.role}">${ROLE_SHORT[w.role]}: ${result.tokens[w.idx]}</span>`;
        });
      });
      html += `</div>`;
    });

    html += `</div>
      <div class="result-time">⏱ 用时 ${result.time.toFixed(1)}s</div>
      ${result.errors > 0 ? `<div class="result-errors">✗ 错误 ${result.errors} 次</div>` : '<div style="font-size:12px;color:#2E7D32;margin-top:4px">✅ 零错误！</div>'}
    </div>`;
  });

  html += `<div style="text-align:center;margin-top:24px">`;
  html += `<button class="start-btn" onclick="restartPractice()">再练一组（随机5句）</button>`;
  html += `</div>`;

  content.innerHTML = html;
}

function restartPractice() {
  document.getElementById('summaryScreen').style.display = 'none';
  document.getElementById('summaryScreen').classList.remove('show');
  document.getElementById('startScreen').style.display = '';
}
</script>
</body>
</html>
